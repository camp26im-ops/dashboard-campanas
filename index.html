.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#b9cde3;font-weight:600}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,4vw,40px);line-height:1.05;margin:8px 0 0;letter-spacing:-.02em}
.updated{font-size:13px;color:#d6e3f2;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);padding:6px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:8px}
.updated:empty{display:none}
.updated::before{content:"";width:8px;height:8px;border-radius:50%;background:#3ddc97;box-shadow:0 0 0 3px rgba(61,220,151,.25)}
.updated b{color:#fff;font-weight:600}

main{max-width:1240px;margin:0 auto;padding:0 24px 56px}

/* ---------- bloqueo ---------- */
.lock{max-width:420px;margin:56px auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px}
.lock h2{font-family:var(--font-display);font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
.lock p{margin:0 0 18px;color:var(--muted);font-size:14px}
.lock form{display:flex;gap:10px}
.lock input{flex:1;min-width:0;border:1px solid #c6d2e1;border-radius:10px;padding:11px 12px;background:#fff}
.lock input:focus-visible,.field:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.msg{font-size:13px;margin-top:12px;min-height:20px;color:var(--muted)}
.msg.err{color:var(--bad)}

/* ---------- botones ---------- */
.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--navy);color:#fff;font-weight:600;cursor:pointer;transition:transform 140ms var(--ease-out),background-color 160ms var(--ease-out)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13px}
@media (hover:hover) and (pointer:fine){
  .btn:hover{background:var(--navy-2)}
  .btn.ghost:hover{background:var(--neutral-bg)}
  .seg button:hover{color:var(--ink)}
  .sortable:hover{color:var(--ink)}
  tbody tr.clickable:hover{background:#f3f7fc}
  .doc-list label:hover{background:var(--neutral-bg)}
}

/* ---------- filtros ---------- */
.filters{position:sticky;top:0;z-index:20;background:rgba(242,245,249,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -24px 22px;padding:14px 24px}
.frow{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end}
.fgroup{display:flex;flex-direction:column;gap:5px}
.flabel{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;background:var(--neutral-bg);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 11px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:background-color 160ms var(--ease-out),color 160ms var(--ease-out),transform 140ms var(--ease-out)}
.seg button:active{transform:scale(.96)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;box-shadow:0 2px 6px rgba(23,56,99,.25)}
.field{border:1px solid #c6d2e1;border-radius:10px;padding:7px 10px;background:#fff;font-size:14px;height:37px}
.dates{display:flex;gap:6px;align-items:center}
.dates span{color:var(--muted);font-size:13px}

.dd{position:relative}
.dd-btn{min-width:220px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.dd-btn::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-2px) rotate(45deg);transition:transform 180ms var(--ease-out)}
.dd.open .dd-btn::after{transform:translateY(2px) rotate(-135deg)}
.dd-panel{position:absolute;top:calc(100% + 6px);left:0;width:300px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(20,35,58,.14);padding:10px;opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top left;pointer-events:none;transition:opacity 160ms var(--ease-out),transform 180ms var(--ease-out)}
.dd.open .dd-panel{opacity:1;transform:none;pointer-events:auto}
.dd-panel input[type=search]{width:100%;border:1px solid #c6d2e1;border-radius:8px;padding:8px 10px;margin-bottom:8px}
.dd-actions{display:flex;gap:6px;margin-bottom:6px}
.doc-list{max-height:260px;overflow:auto}
.doc-list label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:7px;font-size:14px;cursor:pointer}
.doc-list input{accent-color:var(--navy)}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin:0 0 22px}
.kpi{background:var(--surface);border-radius:var(--radius);padding:16px 16px 0;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;min-width:0}
.kpi .row{display:flex;align-items:center;gap:9px}
.kpi .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.kpi .ico svg{width:16px;height:16px}
.kpi .k{font-size:12.5px;font-weight:600;color:var(--muted)}
.kpi .v{font-family:var(--font-display);font-size:clamp(21px,2.2vw,28px);font-weight:700;letter-spacing:-.02em;margin-top:10px;line-height:1.15}
.kpi .spark{display:block;width:calc(100% + 32px);height:38px;margin:10px -16px 0}
.kpi.hero{background:linear-gradient(150deg,#173863,#245a94);color:#fff}
.kpi.hero .k{color:#c9d8ea}
.kpi.hero .ico{background:rgba(255,255,255,.14)!important;color:#fff!important}
.kpi.hero .delta{background:rgba(255,255,255,.14);color:#fff}
.delta{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--neutral-bg);color:var(--ink-2)}
.delta.good{background:var(--good-bg);color:var(--good)}
.delta.bad{background:var(--bad-bg);color:var(--bad)}
.delta svg{width:10px;height:10px}

/* ---------- secciones ---------- */
.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px;margin-bottom:22px}
.panel{background:var(--surface);border:1px solid rgba(221,228,238,.7);box-shadow:var(--shadow);border-radius:var(--radius);padding:20px 20px 16px;min-width:0}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.phead h2{font-family:var(--font-display);font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
.phead .sub{font-size:13px;color:var(--muted)}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.axis text{fill:var(--muted);font-size:11px}
.grid line{stroke:var(--line-soft);stroke-width:1}
.bar-row .track{fill:var(--line-soft)}
.bar-row .fill{fill:url(#barGrad);transition:opacity 140ms var(--ease-out)}
.bar-row.dim .fill{opacity:.35}
.bar-row text.name{fill:var(--ink-2);font-size:12.5px}
.bar-row text.val{fill:var(--ink);font-size:12px;font-weight:600}
.empty{color:var(--muted);font-size:14px;padding:30px 0;text-align:center}
.more{font-size:12px;color:var(--muted);margin-top:8px}

.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:#f3f6fa;border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.45;box-shadow:0 8px 24px rgba(20,35,58,.25);opacity:0;transform:translateY(4px);transition:opacity 120ms var(--ease-out),transform 120ms var(--ease-out);max-width:260px}
.tip.show{opacity:1;transform:none}
.tip .t{font-weight:700;margin-bottom:4px;color:#fff}
.tip .r{display:flex;justify-content:space-between;gap:16px}
.tip .r span:first-child{color:#b9c7d9}
.tip .r strong{font-weight:600}

/* ---------- tablas ---------- */
.tablewrap{overflow:auto;margin:0 -20px -16px;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13.5px;white-space:nowrap}
th,td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--line-soft)}
th:first-child,td:first-child{padding-left:20px}
th:last-child,td:last-child{padding-right:20px}
th.l,td.l{text-align:left}
thead th{position:sticky;top:0;background:#f6f8fb;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.sortable{cursor:pointer;user-select:none}
.sortable[aria-sort]::after{content:"";display:inline-block;margin-left:5px;border:4px solid transparent;vertical-align:middle}
.sortable[aria-sort="descending"]::after{border-top-color:currentColor;transform:translateY(2px)}
.sortable[aria-sort="ascending"]::after{border-bottom-color:currentColor;transform:translateY(-2px)}
tbody tr{transition:background-color 120ms var(--ease-out)}
tbody tr.clickable{cursor:pointer}
td.name{font-weight:600;color:var(--ink)}
.who{display:inline-flex;align-items:center;gap:10px}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;flex:none}
td.sharecell{background:linear-gradient(90deg,transparent calc(100% - var(--share)),rgba(79,143,189,.16) calc(100% - var(--share)));background-clip:padding-box}
td .pill.maps{background:var(--t-aqua);color:#0f6b4a}
td .pill.busq{background:var(--t-blue);color:#1d5ea8}
td .pill.otro{background:var(--t-violet);color:#4a3bb0}
th .thbtn{all:unset;display:inline-flex;align-items:center;gap:6px;cursor:pointer;border-radius:6px;padding:3px 6px;margin:-3px -6px;transition:background-color 140ms var(--ease-out)}
th .thbtn:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
th .thbtn svg{width:12px;height:12px;opacity:.55}
th.filtered .thbtn{background:var(--t-blue);color:#1d5ea8}
th.filtered .thbtn svg{opacity:1}
.colmenu{position:fixed;z-index:60;width:280px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(20,35,58,.18);padding:8px;opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top left;pointer-events:none;transition:opacity 150ms var(--ease-out),transform 170ms var(--ease-out);font-size:13.5px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.colmenu.open{opacity:1;transform:none;pointer-events:auto}
.colmenu .mi{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;border-radius:7px;padding:7px 8px;cursor:pointer;text-align:left;transition:background-color 120ms var(--ease-out)}
.colmenu .mi:active{transform:scale(.98)}
.colmenu .mi svg{width:14px;height:14px;color:var(--muted)}
.colmenu hr{border:0;border-top:1px solid var(--line-soft);margin:6px 0}
.colmenu input[type=search]{width:100%;border:1px solid #c6d2e1;border-radius:8px;padding:7px 9px;margin:2px 0 6px}
.colmenu .vals{max-height:240px;overflow:auto}
.colmenu label{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:7px;cursor:pointer}
.colmenu label.all{font-weight:600;border-bottom:1px solid var(--line-soft);border-radius:0;margin-bottom:2px;padding-bottom:7px}
.colmenu label input{accent-color:var(--navy);flex:none}
.colmenu label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.colmenu label small{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.colmenu .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;padding-top:8px;border-top:1px solid var(--line-soft)}
.tblinfo{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.linkbtn{border:0;background:var(--t-blue);color:#1d5ea8;font-weight:600;font-size:12.5px;border-radius:999px;padding:4px 10px;cursor:pointer;transition:transform 140ms var(--ease-out)}
.linkbtn:active{transform:scale(.96)}
@media (hover:hover) and (pointer:fine){ th .thbtn:hover{background:var(--neutral-bg)} .colmenu .mi:hover,.colmenu label:hover{background:var(--neutral-bg)} }
.btn.xls{display:inline-flex;align-items:center;gap:7px}
.btn.xls svg{width:16px;height:16px;color:#1d7a4c}
td .pill{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--neutral-bg);color:var(--ink-2)}
tfoot td{font-weight:700;background:#f6f8fb}
.tablewrap.tall{max-height:520px}

footer{color:var(--muted);font-size:12px;text-align:center;margin-top:30px}

/* entrada escalonada */
.rise{opacity:0;transform:translateY(8px);animation:rise 260ms var(--ease-out) forwards;animation-delay:calc(var(--i,0) * 50ms)}
@keyframes rise{to{opacity:1;transform:none}}

@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media (max-width:620px){
  .top-in,main{padding-left:16px;padding-right:16px}
  .filters{margin:0 -16px 18px;padding:12px 16px;position:static}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dd-btn{min-width:0;width:100%}.dd-panel{width:min(300px,calc(100vw - 32px))}
  .lock form{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:0ms !important;animation-duration:0ms !important;animation-delay:0ms !important}
  .rise{opacity:1;transform:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div>

</header>

<main>
  <!-- Pantalla de contraseña -->

</main>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";
const METRICS = {
  gas:  {label:"Gasto", money:true},
  conv: {label:"Conversiones"},
  cli:  {label:"Clics"},
  imp:  {label:"Impresiones"}
};
const S = {rows:[], docs:[], sel:new Set(), tipo:"", start:"", end:"", min:"", max:"", metric:"gas",
           docSort:{k:"gas",d:-1}, campSort:{k:"gas",d:-1}, currency:"MXN", docRows:[], campRows:[]};

/* ---------- utilidades ---------- */
const nf0 = new Intl.NumberFormat("es-MX",{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat("es-MX",{maximumFractionDigits:1});
const nf2 = new Intl.NumberFormat("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});
let cf = new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",maximumFractionDigits:0});
let cf2 = new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",minimumFractionDigits:2,maximumFractionDigits:2});
const fmt = (m, v) => m === "gas" ? cf.format(v) : (m === "conv" ? nf1.format(v) : nf0.format(v));
const ratio = (a, b) => b ? a / b : null;
const el = (tag, attrs = {}, text) => { const e = document.createElement(tag); for (const [k,v] of Object.entries(attrs)) e.setAttribute(k,v); if (text !== undefined) e.textContent = text; return e; };
const svg = (tag, attrs = {}) => { const e = document.createElementNS(SVGNS, tag); for (const [k,v] of Object.entries(attrs)) e.setAttribute(k,v); return e; };
const store = { get(k){ try { return sessionStorage.getItem(k); } catch { return null; } }, set(k,v){ try { sessionStorage.setItem(k,v); } catch {} } };
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); };
const daysBetween = (a, b) => Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00")) / 864e5);
const prettyDate = iso => new Date(iso+"T12:00:00").toLocaleDateString("es-MX",{day:"numeric",month:"short"});

/* ---------- descifrado ---------- */
let pkg = null;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function loadPackage(){
  const r = await fetch("datos.enc.json?ts=" + Date.now(), {cache:"no-store"});
  if (!r.ok) throw new Error("No se encontraron los datos (HTTP " + r.status + ").");
  return r.json();
}
async function decrypt(p, pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(p.salt), iterations:p.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(p.iv)}, key, b64(p.datos));
  let text;

  hit.addEventListener("keydown", e => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return; e.preventDefault();
    const r = s.getBoundingClientRect(); const ni = idx + (e.key === "ArrowRight" ? 1 : -1);
    const ci = Math.max(0, Math.min(days.length - 1, ni));
    show(ci, r.left + pts[ci][0] * r.width / W, r.top + pts[ci][1] * r.height / H);
  });
  host.append(s);
}

/* tablas */
function sortRows(rows, st){ const {k, d} = st; return rows.sort((a, b) => {
  const x = a[k], y = b[k]; if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
  return typeof x === "string" ? d * x.localeCompare(y, "es") : d * (x - y); }); }
const FUNNEL = '<path d="M2 3h12l-4.6 5.4V13l-2.8-1.4V8.4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>';
function header(table, cols, st, onSort, filt){
  const tr = el("tr");
  cols.forEach(c => {
    if (c.filter && filt) {
      const th = el("th", {class:(c.l ? "l " : "") + (filt.sel[c.k] ? "filtered" : ""), scope:"col"});
      if (st.k === c.k) th.setAttribute("aria-sort", st.d > 0 ? "ascending" : "descending");
      const b = el("button", {type:"button", class:"thbtn", "aria-haspopup":"dialog", title:"Ordenar o filtrar " + c.h});
      b.append(document.createTextNode(c.h + (st.k === c.k ? (st.d > 0 ? " ↑" : " ↓") : "")));
      const ic = svg("svg", {viewBox:"0 0 16 16", "aria-hidden":"true"}); ic.innerHTML = FUNNEL; b.append(ic);
      b.addEventListener("click", e => { e.stopPropagation(); openColMenu(b, c, st, onSort, filt); });
      th.append(b); tr.append(th); return;
    }
    const th = el("th", {class:(c.l ? "l " : "") + "sortable", scope:"col", tabindex:"0"}, c.h);
    if (st.k === c.k) th.setAttribute("aria-sort", st.d > 0 ? "ascending" : "descending");
    const go = () => { st.d = st.k === c.k ? -st.d : (c.l ? 1 : -1); st.k = c.k; onSort(); };
    th.addEventListener("click", go); th.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
    tr.append(th);
  });
  const thead = el("thead"); thead.append(tr); table.append(thead);
}
const withRatios = a => Object.assign(a, {cpa: ratio(a.gas, a.conv), ctr: a.imp ? a.cli / a.imp : null});
const AV = [["#e3eefb","#1d5ea8"],["#dff5ec","#0f6b4a"],["#fdebe3","#a8441c"],["#ebe8fb","#4a3bb0"],["#fdf2d9","#8a5d00"],["#fae6ee","#a3335d"]];
const hash = t => [...String(t)].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) >>> 0, 7);
const initials = t => String(t).replace(/^(dra?\.?|dr\.)\s+/i, "").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";
const tipoClass = t => /maps|gmb|gbm/i.test(t) ? "maps" : /b[uú]squeda|search/i.test(t) ? "busq" : "otro";
const cell = (c, v, row) => { const td = el("td", {class:(c.l ? "l " : "num ") + (c.cls || "")});
  if (c.pill) td.append(el("span", {class:"pill " + tipoClass(v || "")}, v || "—"));
  else if (c.avatar && row && row.key !== "Total") {
    const [bg, fg] = AV[hash(v) % AV.length];
    const w = el("span", {class:"who"}); w.append(el("span", {class:"av", style:`background:${bg};color:${fg}`, "aria-hidden":"true"}, initials(v)), document.createTextNode(v)); td.append(w);
  } else td.textContent = c.f ? (v == null ? "—" : c.f(v)) : (v || "—");
  if (c.share && row && row._share != null) {
    const pct = (row._rel * 100).toFixed(1);
    td.classList.add("sharecell"); td.title = nf1.format(row._share * 100) + "% del gasto del periodo";
    td.style.setProperty("--share", pct + "%");
  }
  return td; };
const NUMCOLS = [
  {k:"gas", h:"Gasto", f:v => cf2.format(v)}, {k:"conv", h:"Conversiones", f:v => nf1.format(v)},
  {k:"cpa", h:"Costo por conv.", f:v => cf2.format(v)}, {k:"cli", h:"Clics", f:v => nf0.format(v)},
  {k:"ctr", h:"CTR", f:v => nf2.format(v * 100) + "%"}, {k:"imp", h:"Impresiones", f:v => nf0.format(v)}
];

function renderDocTable(){
  const t = $("docTable"); t.replaceChildren();
  const cols = [{k:"key", h:"Doctor", l:true, cls:"name", avatar:true}, Object.assign({}, NUMCOLS[0], {share:true}), ...NUMCOLS.slice(1)];
  S.docRows = sortRows(group(filtered, r => r.doc).map(withRatios), S.docSort);
  const totalGas = S.docRows.reduce((a, r) => a + r.gas, 0);
  S.docRows.forEach(r => r._share = totalGas ? r.gas / totalGas : 0);
  const maxShare = Math.max(0, ...S.docRows.map(r => r._share)) || 1;
  S.docRows.forEach(r => r._rel = r._share / maxShare);
  header(t, cols, S.docSort, renderDocTable);
  const tb = el("tbody");
  if (!S.docRows.length) { const tr = el("tr"); tr.append(el("td", {colspan:cols.length, class:"l empty"}, "No hay datos con estos filtros.")); tb.append(tr); }
  S.docRows.forEach(a => {
    const tr = el("tr", {class:"clickable", tabindex:"0", title:"Ver solo a " + a.key});
    cols.forEach(c => tr.append(cell(c, a[c.k], a)));
    const pick = () => { S.sel = new Set([a.key]); buildDocList(); render(); window.scrollTo({top:0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); };
    tr.addEventListener("click", pick); tr.addEventListener("keydown", e => { if (e.key === "Enter") pick(); });
    tb.append(tr);
  });
  t.append(tb);
  if (S.docRows.length > 1) {
    const tot = withRatios(filtered.reduce(add, blank())); tot.key = "Total";
    const tf = el("tfoot"), tr = el("tr"); cols.forEach(c => tr.append(cell(Object.assign({}, c, {share:false}), tot[c.k], tot))); tf.append(tr); t.append(tf);
  }
}

/* menú tipo Excel para columnas de texto */
const campFilt = {sel:{}, base:[]};   // sel[k] = Set de valores elegidos (null = todos)
const menu = $("colMenu");
let menuFor = null;
function closeColMenu(){ menu.classList.remove("open"); menuFor = null; }
function valuesFor(k, filt){
  // valores disponibles según los OTROS filtros de la tabla (como en Excel)
  const rows = filt.base.filter(r => Object.entries(filt.sel).every(([kk, set]) => kk === k || !set || set.has(r[kk])));
  const m = new Map(); rows.forEach(r => m.set(r[k], (m.get(r[k]) || 0) + 1));
  return [...m.entries()].sort((a, b) => String(a[0]).localeCompare(String(b[0]), "es"));
}
function openColMenu(btn, c, st, onSort, filt){
  if (menuFor === c.k && menu.classList.contains("open")) { closeColMenu(); return; }
  menuFor = c.k; menu.replaceChildren();
  const ARROW_UP = '<path d="M8 13V3M4 7l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>';
  const ARROW_DN = '<path d="M8 3v10M4 9l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>';
  [["Ordenar A → Z", 1, ARROW_UP], ["Ordenar Z → A", -1, ARROW_DN]].forEach(([t, d, ico]) => {
    const b = el("button", {type:"button", class:"mi"}); const i = svg("svg", {viewBox:"0 0 16 16", "aria-hidden":"true"}); i.innerHTML = ico;
    b.append(i, document.createTextNode(t)); b.addEventListener("click", () => { st.k = c.k; st.d = d; closeColMenu(); onSort(); }); menu.append(b);
  });
  menu.append(el("hr"));
  const vals = valuesFor(c.k, filt);
  const cur = filt.sel[c.k] ? new Set(filt.sel[c.k]) : new Set(vals.map(v => v[0]));
  const search = el("input", {type:"search", placeholder:"Buscar en " + c.h.toLowerCase() + "…", "aria-label":"Buscar"});
  const list = el("div", {class:"vals"});
  const allCb = el("input", {type:"checkbox"}), allLab = el("label", {class:"all"});
  allLab.append(allCb, el("span", {}, "Seleccionar todo"));
  const draw = () => {
    const q = search.value.trim().toLowerCase();
    const shown = vals.filter(([v]) => String(v || "(vacío)").toLowerCase().includes(q));
    list.replaceChildren(allLab);
    shown.forEach(([v, n]) => {
      const cb = el("input", {type:"checkbox"}); cb.checked = cur.has(v);
      cb.addEventListener("change", () => { cb.checked ? cur.add(v) : cur.delete(v); sync(); });
      const lab = el("label"); lab.append(cb, el("span", {title:String(v || "(vacío)")}, String(v || "(vacío)")), el("small", {}, String(n)));
      list.append(lab);
    });
    if (!shown.length) list.append(el("div", {class:"empty", style:"padding:12px 0"}, "Sin coincidencias"));
    const allShown = shown.length && shown.every(([v]) => cur.has(v)), someShown = shown.some(([v]) => cur.has(v));
    allCb.checked = !!allShown; allCb.indeterminate = !allShown && someShown;
    allCb._shown = shown;
  };
  allCb.addEventListener("change", () => { (allCb._shown || []).forEach(([v]) => allCb.checked ? cur.add(v) : cur.delete(v)); draw(); });
  const sync = () => draw();
  search.addEventListener("input", draw);
  // Enter en el buscador = quedarse solo con lo que coincide (como Excel)
  search.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); cur.clear(); (allCb._shown || []).forEach(([v]) => cur.add(v)); apply(); } });
  const foot = el("div", {class:"foot"});
  const clear = el("button", {type:"button", class:"btn ghost small"}, "Limpiar");
  const ok = el("button", {type:"button", class:"btn small"}, "Aplicar");
  const apply = () => { filt.sel[c.k] = cur.size === vals.length ? null : new Set(cur); closeColMenu(); onSort(); };
  clear.addEventListener("click", () => { filt.sel[c.k] = null; closeColMenu(); onSort(); });
  ok.addEventListener("click", apply);
  foot.append(clear, ok);
  menu.append(search, list, foot);
  draw();
  const r = btn.getBoundingClientRect(), w = 280;
  menu.style.left = Math.max(8, Math.min(r.left - 6, innerWidth - w - 8)) + "px";
  const top = r.bottom + 8, h = Math.min(440, innerHeight - 16);
  menu.style.top = (top + 380 > innerHeight ? Math.max(8, r.top - 8 - Math.min(380, h)) : top) + "px";
  menu.classList.add("open");
  setTimeout(() => search.focus(), 30);
}
document.addEventListener("click", e => { if (menuFor && !menu.contains(e.target)) closeColMenu(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && menuFor) closeColMenu(); });
addEventListener("scroll", e => { if (menuFor && !menu.contains(e.target)) closeColMenu(); }, true);

function renderCampTable(){
  const t = $("campTable"); t.replaceChildren();
  const cols = [{k:"doc", h:"Doctor", l:true, cls:"name", filter:true}, {k:"camp", h:"Campaña", l:true, filter:true},
                {k:"ubi", h:"Ubicación", l:true, filter:true}, {k:"tipo", h:"Tipo", l:true, pill:true, filter:true}, ...NUMCOLS];
  campFilt.base = group(filtered, r => [r.doc, r.camp, r.ubi, r.tipo].join("\u0001"),
    r => ({doc:r.doc, camp:r.camp, ubi:r.ubi, tipo:r.tipo})).map(withRatios);
  // si un valor elegido ya no existe con los filtros de arriba, se ignora
  const active = Object.entries(campFilt.sel).filter(([, set]) => set);
  S.campRows = sortRows(campFilt.base.filter(r => active.every(([k, set]) => set.has(r[k]))), S.campSort);
  header(t, cols, S.campSort, renderCampTable, campFilt);
  const tb = el("tbody");
  if (!S.campRows.length) { const tr = el("tr"); tr.append(el("td", {colspan:cols.length, class:"l empty"}, "No hay campañas con estos filtros.")); tb.append(tr); }
  S.campRows.forEach(a => { const tr = el("tr"); cols.forEach(c => tr.append(cell(c, a[c.k]))); tb.append(tr); });
  t.append(tb);
  if (S.campRows.length > 1) {
    const tot = withRatios(S.campRows.reduce((a, r) => add(a, r), blank())); tot.doc = "Total";
    const tf = el("tfoot"), tr = el("tr"); cols.forEach(c => tr.append(cell(Object.assign({}, c, {pill:false}), c.k === "doc" ? "Total" : (c.l ? " " : tot[c.k]), tot))); tf.append(tr); t.append(tf);
  }
  $("campInfo").textContent = active.length ? `Mostrando ${S.campRows.length} de ${campFilt.base.length} campañas` : `${campFilt.base.length} campañas`;
  $("campClear").hidden = !active.length;
}
$("campClear").addEventListener("click", () => { campFilt.sel = {}; renderCampTable(); });

/* exportar a Excel (SheetJS se carga solo al descargar) */
let xlsxLib = null;
function loadXLSX(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (xlsxLib) return xlsxLib;
  xlsxLib = new Promise((ok, bad) => {
    const sc = el("script", {src:"https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"});
    sc.onload = () => ok(window.XLSX); sc.onerror = () => { xlsxLib = null; bad(new Error("No se pudo cargar el generador de Excel. Revisa tu conexión.")); };
    document.head.append(sc);
  });
  return xlsxLib;
}
const MONEY = '"$"#,##0.00', INT = "#,##0", DEC = "#,##0.0", PCT = "0.00%";
async function downloadExcel(btn, name, sheet, cols, rows){
  if (!rows.length) return;
  const label = btn.lastChild.textContent; btn.disabled = true; btn.lastChild.textContent = "Preparando…";
  try {
    const X = await loadXLSX();
    const data = [cols.map(c => c.h), ...rows.map(r => cols.map(c => { const v = r[c.k]; return v == null ? "" : typeof v === "number" ? Math.round(v * 1e4) / 1e4 : v; }))];
    const ws = X.utils.aoa_to_sheet(data);
    rows.forEach((r, i) => cols.forEach((c, j) => { if (c.z) { const cellRef = X.utils.encode_cell({r:i + 1, c:j}); if (ws[cellRef] && ws[cellRef].t === "n") ws[cellRef].z = c.z; } }));
    ws["!cols"] = cols.map(c => ({wch: c.w || 14}));
    ws["!autofilter"] = {ref: X.utils.encode_range({s:{r:0, c:0}, e:{r:rows.length, c:cols.length - 1}})};
    const info = X.utils.aoa_to_sheet([
      ["Reporte", sheet], ["Periodo", S.start + " a " + S.end],
      ["Doctores", S.sel.size === S.docs.length ? "Todos (" + S.docs.length + ")" : [...S.sel].join(", ")],
      ["Tipo de campaña", S.tipo || "Todos"], ["Moneda", S.currency || "Varias"],
      ...(sheet.startsWith("Detalle") ? Object.entries(campFilt.sel).filter(([, v]) => v).map(([k, v]) => ["Filtro " + ({doc:"Doctor", camp:"Campaña", ubi:"Ubicación", tipo:"Tipo"}[k] || k), [...v].join(", ")]) : []),
      ["Generado", new Date().toLocaleString("es-MX")]]);
    info["!cols"] = [{wch:18}, {wch:60}];
    const wb = X.utils.book_new();
    X.utils.book_append_sheet(wb, ws, sheet.slice(0, 31));
    X.utils.book_append_sheet(wb, info, "Filtros");
    X.writeFile(wb, name + "_" + S.start + "_a_" + S.end + ".xlsx", {compression:true});
  } catch (e) { alertMsg(e.message); }
  finally { btn.disabled = false; btn.lastChild.textContent = label; }
}
function alertMsg(m){ const f = $("foot"); const prev = f.textContent; f.textContent = m; f.style.color = "var(--bad)"; setTimeout(() => { f.textContent = prev; f.style.color = ""; }, 5000); }
const XCOLS = [
  {k:"gas", h:"Gasto", z:MONEY, w:14}, {k:"conv", h:"Conversiones", z:DEC, w:13}, {k:"cpa", h:"Costo por conversión", z:MONEY, w:19},
  {k:"cli", h:"Clics", z:INT, w:10}, {k:"ctr", h:"CTR", z:PCT, w:9}, {k:"imp", h:"Impresiones", z:INT, w:13}];
$("expDocs").addEventListener("click", e => downloadExcel(e.currentTarget, "resumen_doctores", "Resumen por doctor",
  [{k:"key", h:"Doctor", w:30}, ...XCOLS, {k:"_share", h:"% del gasto", z:PCT, w:12}], S.docRows));
$("expCamps").addEventListener("click", e => downloadExcel(e.currentTarget, "detalle_campanas", "Detalle de campañas",
  [{k:"doc", h:"Doctor", w:28}, {k:"camp", h:"Campaña", w:30}, {k:"ubi", h:"Ubicación", w:16}, {k:"tipo", h:"Tipo", w:12}, ...XCOLS], S.campRows));

let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (S.rows.length) renderCharts(); }, 120); });

if (saved) unlock(saved, true);
})();
